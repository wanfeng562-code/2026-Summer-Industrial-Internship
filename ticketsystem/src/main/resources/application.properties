spring.application.name=ticketsystem

spring.datasource.url=jdbc:mysql://localhost:3306/ticket_system?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.type-aliases-package=com.alibaba.ticketsystem.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml

sa-token.token-name=Authorization
sa-token.timeout=2592000
sa-token.active-timeout=7200
sa-token.is-concurrent=true
sa-token.is-share=false
sa-token.token-prefix=Bearer
sa-token.is-log=true
sa-token.is-read-header=true
sa-token.is-read-param=false

spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY}
spring.ai.dashscope.chat.options.model=qwen3.7-max
spring.ai.dashscope.chat.options.temperature=0.7
